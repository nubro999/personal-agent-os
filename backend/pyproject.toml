[project]
name = "personal-agent-os-backend"
version = "0.1.0"
description = "Personal Agent OS backend: FastAPI, LangGraph, PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "claude-agent-sdk>=0.2.175",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.18",
    "pydantic-settings>=2.16.2",
    "pymysql>=1.2.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "langgraph-cli[inmem]>=0.4.40",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "types-pymysql>=1.2.0.20260923",
    "types-pyyaml>=6.0.12.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# 프롬프트 문장은 줄바꿈하면 모델에 그대로 들어가므로 길이 제한을 두지 않는다.
"app/agents/task/prompts.py" = ["E501"]
"app/trackers/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
