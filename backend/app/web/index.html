<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal OS</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f7f6f3; --panel: #ffffff; --line: #e4e2dc; --text: #24231f; --muted: #76736b;
  --accent: #2f5fd0; --warn: #b4531a; --ok: #2c7a4b; --soft: #eeece6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171714; --panel: #20201c; --line: #34332d; --text: #ecebe6; --muted: #9a978d;
    --accent: #7ea2f0; --warn: #e3965c; --ok: #6fbf8f; --soft: #2a2a25;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
.app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100%; }
.board { overflow-y: auto; padding: 24px 28px 48px; }
.top { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
h1 { font-size: 20px; margin: 0; }
.counts { color: var(--muted); font-size: 13px; }
section { margin-bottom: 26px; }
h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; letter-spacing: .02em; }
.task {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 12px; margin-bottom: 6px;
}
.title { overflow-wrap: anywhere; }
.meta { grid-column: 1; color: var(--muted); font-size: 12.5px; }
.overdue { color: var(--warn); font-weight: 600; }
.reason { grid-column: 1 / -1; color: var(--ok); font-size: 13px; }
.actions { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; }
button {
  font: inherit; font-size: 13px; color: var(--text); background: var(--soft);
  border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer;
}
button:hover { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
.empty { color: var(--muted); font-size: 13px; }
.draft { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.draft .for { color: var(--muted); font-size: 12.5px; margin-bottom: 4px; overflow-wrap: anywhere; }
.draft textarea { width: 100%; font: inherit; font-size: 14px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; resize: vertical; }
.draft .row { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
.draft a { font-size: 13px; color: var(--accent); }
details > summary { cursor: pointer; }
.chat { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--line); }
.log { flex: 1; overflow-y: auto; padding: 18px 16px; }
.msg { white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 12px; font-size: 14px; }
.msg.me { background: var(--soft); border-radius: 8px; padding: 7px 10px; margin-left: 28px; }
.msg.wait { color: var(--muted); }
form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
textarea {
  flex: 1; resize: none; font: inherit; font-size: 14px; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 40px;
}
.error { color: var(--warn); font-size: 13px; margin-bottom: 12px; }
@media (max-width: 800px) {
  .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 46%; }
  .board { padding: 16px; }
  .chat { border-left: 0; border-top: 1px solid var(--line); }
}
</style>
</head>
<body>
<div class="app">
  <main class="board">
    <div class="top"><h1>할 일</h1><span class="counts" id="counts"></span></div>
    <div class="error" id="error" hidden></div>
    <div id="sections"></div>
  </main>
  <aside class="chat">
    <div class="log" id="log"></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="내일까지 2325 Eval 돌려야 해" aria-label="에이전트에게 말하기"></textarea>
      <button type="submit" id="send">보내기</button>
    </form>
  </aside>
</div>
<script>
const AGENT = "http://localhost:2024";
const STATUS = { in_progress: "진행 중", todo: "할 일", blocked: "고객 답 대기" };
const SOURCE = { natural_language: "직접", claude_code: "Claude Code", slack: "Slack", "2325": "2325" };
const $ = (id) => document.getElementById(id);

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function showError(message) {
  $("error").hidden = !message;
  $("error").textContent = message || "";
}

async function post(url, body) {
  const response = await fetch(url, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (response.status === 409) { showError("그사이 바뀌었어요. 목록을 새로 불렀어요."); await load(); return null; }
  if (!response.ok) throw new Error(`요청 실패 (${response.status})`);
  return response.json();
}

function taskRow(task, today) {
  const row = el("div", "task");
  row.append(el("div", "title", task.title));
  const meta = el("div", "meta");
  const parts = [];
  if (task.project) parts.push(task.project);
  parts.push(SOURCE[task.source] || task.source);
  if (task.priority === "urgent" || task.priority === "high") parts.push(task.priority === "urgent" ? "긴급" : "높음");
  meta.textContent = parts.join(" · ");
  if (task.due_date) {
    const due = el("span", task.due_date <= today ? "overdue" : "", ` · 마감 ${task.due_date}`);
    meta.append(due);
  }
  row.append(meta);
  const actions = el("div", "actions");
  const done = el("button", "", "완료");
  done.addEventListener("click", async () => {
    done.disabled = true;
    await post(`/api/tasks/${task.id}/status`, { status: "done", version: task.version, request_id: crypto.randomUUID() });
    await load();
  });
  actions.append(done);
  if (task.suggestion) {
    const no = el("button", "", "아니야");
    no.addEventListener("click", async () => {
      no.disabled = true;
      await post(`/api/tasks/${task.id}/suggestion/dismiss`);
      await load();
    });
    actions.append(no);
    row.append(el("div", "reason", task.suggestion));
  }
  row.append(actions);
  return row;
}

function draftCard(draft) {
  const card = el("div", "draft");
  card.append(el("div", "for", draft.task_title || "Slack 답변"));
  const box = el("textarea");
  box.rows = Math.min(6, draft.draft.split("\n").length + 1);
  box.value = draft.draft;
  box.setAttribute("aria-label", "답변 초안");
  const row = el("div", "row");
  const copy = el("button", "", "복사");
  copy.addEventListener("click", async () => {
    await navigator.clipboard.writeText(box.value);
    copy.textContent = "복사했어요";
  });
  const open = el("a", "", "Slack에서 열기");
  open.href = draft.slack_url;
  open.target = "_blank";
  open.rel = "noopener";
  const drop = el("button", "", "버리기");
  drop.addEventListener("click", async () => {
    drop.disabled = true;
    await post(`/api/drafts/${draft.id}/dismiss`);
    await load();
  });
  row.append(copy, open, drop);
  card.append(box, row);
  return card;
}

function section(title, tasks, today, collapsed) {
  if (!tasks.length) return null;
  const wrap = el("section");
  const list = tasks.map((t) => taskRow(t, today));
  if (collapsed) {
    const details = el("details");
    const summary = el("summary");
    summary.append(el("h2", "", `${title} ${tasks.length}`));
    summary.firstChild.style.display = "inline";
    details.append(summary, ...list);
    wrap.append(details);
  } else {
    wrap.append(el("h2", "", `${title} ${tasks.length}`), ...list);
  }
  return wrap;
}

async function load() {
  try {
    const response = await fetch("/api/tasks");
    if (!response.ok) throw new Error(`목록을 불러오지 못했어요 (${response.status})`);
    const tasks = await response.json();
    const draftResponse = await fetch("/api/drafts");
    const drafts = draftResponse.ok ? await draftResponse.json() : [];
    const today = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
    const rest = tasks.filter((t) => !t.suggestion);
    const dueSoon = rest.filter((t) => t.due_date && t.due_date <= today);
    const others = rest.filter((t) => !dueSoon.includes(t));
    let draftSection = null;
    if (drafts.length) {
      draftSection = el("section");
      draftSection.append(el("h2", "", `답변 초안 ${drafts.length}`), ...drafts.map(draftCard));
    }
    const groups = [
      draftSection,
      section("끝난 것 같은 일", tasks.filter((t) => t.suggestion), today),
      section("오늘까지", dueSoon, today),
      section(STATUS.in_progress, others.filter((t) => t.status === "in_progress"), today),
      section(STATUS.todo, others.filter((t) => t.status === "todo"), today),
      section(STATUS.blocked, others.filter((t) => t.status === "blocked"), today, true),
    ].filter(Boolean);
    const target = $("sections");
    target.replaceChildren(...groups);
    if (!groups.length) target.append(el("div", "empty", "열린 할 일이 없어요."));
    $("counts").textContent = `열린 일 ${tasks.length}개`;
    showError("");
  } catch (error) {
    showError(error.message);
  }
}

function say(text, kind) {
  const node = el("div", `msg ${kind || ""}`, text);
  $("log").append(node);
  $("log").scrollTop = $("log").scrollHeight;
  return node;
}

let threadId = null;
try { threadId = localStorage.getItem("pao-thread"); } catch { /* 저장 못 해도 동작한다 */ }

async function ensureThread() {
  if (threadId) {
    const check = await fetch(`${AGENT}/threads/${threadId}`);
    if (check.ok) return threadId;
  }
  const response = await fetch(`${AGENT}/threads`, {
    method: "POST", headers: { "content-type": "application/json" }, body: "{}",
  });
  threadId = (await response.json()).thread_id;
  try { localStorage.setItem("pao-thread", threadId); } catch { /* 위와 같다 */ }
  return threadId;
}

async function send(text) {
  say(text, "me");
  const waiting = say("생각하는 중…", "wait");
  $("send").disabled = true;
  try {
    const id = await ensureThread();
    const response = await fetch(`${AGENT}/threads/${id}/runs/wait`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ assistant_id: "task_agent", input: { messages: [{ type: "human", content: text }] } }),
    });
    if (!response.ok) throw new Error(`에이전트 응답 실패 (${response.status})`);
    const state = await response.json();
    const last = state.messages[state.messages.length - 1];
    waiting.className = "msg";
    waiting.textContent = last.content;
    await load();
  } catch (error) {
    waiting.className = "msg error";
    waiting.textContent = `${error.message}. 에이전트 서버(localhost:2024)가 떠 있는지 확인해 주세요.`;
  } finally {
    $("send").disabled = false;
  }
}

$("form").addEventListener("submit", (event) => {
  event.preventDefault();
  const text = $("input").value.trim();
  if (!text || $("send").disabled) return;
  $("input").value = "";
  send(text);
});
$("input").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    $("form").requestSubmit();
  }
});

load();
// 초안을 고치는 중에는 자동 새로고침으로 덮어쓰지 않는다.
setInterval(() => { if (document.activeElement?.closest(".draft") == null) load(); }, 60000);
</script>
</body>
</html>
